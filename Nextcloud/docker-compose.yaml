services:
  nextcloud-db:
    image: mariadb:10.6
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    networks:
      - nextcloud-stack
    volumes:
      - nextcloud_db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=<PASSWORD>
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=<PASSWORD>

  nextcloud-redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - nextcloud-stack

  nextcloud-local:
    image: nextcloud:latest
    container_name: nextcloud-local
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - nextcloud-stack
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    volumes:
      # Application config (Named Volume)
      - nextcloud_config:/var/www/html
      # Your existing School/CompSci data
      - /mnt/nextcloud:/var/www/html/data
      # SSL Certificates
      - /etc/ssl/montysplace/fullchain.pem:/etc/apache2/ssl/nextcloud.crt:ro
      - /etc/ssl/montysplace/privkey.pem:/etc/apache2/ssl/nextcloud.key:ro
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=<PASSWORD>
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_ADMIN_USER=monty
      - NEXTCLOUD_ADMIN_PASSWORD=<PASSWORD>
      - NEXTCLOUD_TRUSTED_DOMAINS=servermgr1.montysplace.local
      - PHP_MEMORY_LIMIT=2G
      - PHP_UPLOAD_LIMIT=10G

networks:
  nextcloud-stack:
    name: nextcloud-stack
    driver: bridge

volumes:
  nextcloud_db_data:
  nextcloud_config:
    external: true
